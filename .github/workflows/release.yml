name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Require the tag to match package.json
        run: |
          version="$(bun -e 'const pkg = await Bun.file("package.json").json(); console.log(pkg.version)')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version v${version}" >&2
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun pm pack --ignore-scripts --destination release-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: release-artifact/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package-tarball
          path: package-tarball
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Require npm with Trusted Publishing support
        run: |
          npm install --global "npm@^11.5.1"
          npm --version
      - run: npm publish ./package-tarball/*.tgz --access public
